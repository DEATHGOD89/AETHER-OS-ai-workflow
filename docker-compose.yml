version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: aether-postgres
    environment:
      POSTGRES_USER: aether
      POSTGRES_PASSWORD: aether_secret_password
      POSTGRES_DB: aether_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: aether-redis
    ports:
      - "6379:6379"

  meilisearch:
    image: getmeili/meilisearch:v1.12
    container_name: aether-meilisearch
    environment:
      MEILI_MASTER_KEY: aether_meili_master_key
    ports:
      - "7700:7700"

  qdrant:
    image: qdrant/qdrant:latest
    container_name: aether-qdrant
    ports:
      - "6333:6333"

  minio:
    image: minio/minio:latest
    container_name: aether-minio
    environment:
      MINIO_ROOT_USER: aether_minio
      MINIO_ROOT_PASSWORD: aether_minio_password
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"

volumes:
  pgdata:
